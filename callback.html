<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Callback • FreeCloudi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 30% 30%, #1a1a2e, #0a0a12);
            padding: 20px;
        }

        .glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 48px;
            padding: 44px 40px;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: popIn 0.7s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .glass i {
            font-size: 3.2rem;
            color: #b3a0ff;
            margin-bottom: 16px;
            display: inline-block;
            animation: floatY 2.5s infinite alternate;
        }

        @keyframes floatY {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-8px);
            }
        }

        .glass h2 {
            color: #fff;
            font-weight: 500;
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .glass .sub {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .user-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 28px;
            padding: 20px 24px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin: 16px 0 24px;
        }

        .user-card .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .user-card .row:last-child {
            border-bottom: none;
        }

        .user-card .label {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .user-card .value {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            font-size: 0.95rem;
            word-break: break-all;
            text-align: right;
            max-width: 60%;
        }

        .btn-go {
            display: inline-block;
            padding: 16px 40px;
            border-radius: 40px;
            background: linear-gradient(135deg, #7f66ff, #aa8aff);
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            border: none;
            font-size: 1rem;
            transition: all 0.25s ease;
            box-shadow: 0 8px 28px rgba(120, 80, 255, 0.2);
            cursor: pointer;
        }

        .btn-go:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 36px rgba(120, 80, 255, 0.3);
        }

        .btn-go i {
            font-size: 1rem;
            margin-left: 10px;
        }

        .error-msg {
            color: #ff8a8a;
            background: rgba(255, 70, 70, 0.06);
            padding: 14px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 70, 70, 0.06);
            font-size: 0.95rem;
            margin: 16px 0;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="glass" id="callbackContainer">
        <i class="fas fa-cloud-upload-alt"></i>
        <h2>Proses Login</h2>
        <div class="sub">Menghubungkan dengan FreeCloudi...</div>

        <!-- akan diisi oleh JavaScript -->
        <div id="userInfo" class="hidden"></div>
        <div id="errorInfo" class="hidden"></div>

        <button id="goToChat" class="btn-go hidden">
            Buka Chat <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <script>
        (function() {
            const container = document.getElementById('callbackContainer');
            const userDiv = document.getElementById('userInfo');
            const errorDiv = document.getElementById('errorInfo');
            const goBtn = document.getElementById('goToChat');

            // --- baca query parameter ---
            const params = new URLSearchParams(window.location.search);
            const uid = params.get('freecloudi_uid');
            const username = params.get('freecloudi_username');
            const email = params.get('freecloudi_email');
            const error = params.get('freecloudi_error');

            // --- jika ada error atau tidak ada username ---
            if (error || !username) {
                errorDiv.classList.remove('hidden');
                errorDiv.className = 'error-msg';
                errorDiv.innerHTML = `
                    <i class="fas fa-exclamation-triangle" style="margin-right:10px;"></i>
                    ${error || 'Login dibatalkan atau data tidak lengkap.'}
                `;
                // tetap munculkan tombol untuk coba lagi
                goBtn.textContent = 'Coba Login Lagi';
                goBtn.onclick = function() {
                    window.location.href = 'login.html';
                };
                goBtn.classList.remove('hidden');
                return;
            }

            // --- sukses: tampilkan data user ---
            userDiv.classList.remove('hidden');
            userDiv.className = 'user-card';
            userDiv.innerHTML = `
                <div class="row">
                    <span class="label"><i class="fas fa-user"></i> Username</span>
                    <span class="value">${username}</span>
                </div>
                <div class="row">
                    <span class="label"><i class="fas fa-envelope"></i> Email</span>
                    <span class="value">${email || '—'}</span>
                </div>
                <div class="row">
                    <span class="label"><i class="fas fa-id-badge"></i> UID</span>
                    <span class="value" style="font-size:0.75rem;">${uid || '—'}</span>
                </div>
            `;

            // simpan ke localStorage agar index.html tahu user sudah login via FreeCloudi
            if (username) {
                localStorage.setItem('fc_username', username);
                localStorage.setItem('fc_email', email || '');
                // token dummy biar gak diarahkan ke login lagi (karena FreeCloudi tidak kasih token JWT)
                localStorage.setItem('fc_token', 'freecloudi_' + Date.now());
            }

            // tampilkan tombol Buka Chat
            goBtn.classList.remove('hidden');
            goBtn.textContent = 'Buka Chat';
            goBtn.onclick = function() {
                window.location.href = 'index.html';
            };

            // ubah judul
            document.querySelector('.glass h2').textContent = '✅ Login Berhasil!';
            document.querySelector('.glass .sub').textContent = 'Selamat datang, ' + username;

        })();
    </script>

</body>
</html>
