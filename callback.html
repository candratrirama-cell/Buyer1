<!DOCTYPE html>
<html>
<body>
  <h1>Proses Login...</h1>
  <script>
    const params = new URLSearchParams(window.location.search);
    const username = params.get('freecloudi_username');
    if (username) {
      localStorage.setItem('user', JSON.stringify({
        uid: params.get('freecloudi_uid'),
        username: username,
        email: params.get('freecloudi_email')
      }));
      window.location.href = 'index.html';
    } else {
      document.body.innerHTML = 'Login gagal. <a href="index.html">Kembali</a>';
    }
  </script>
</body>
</html>
