<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartAI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body>

    <div id="landing-page" class="landing-container">
        <div class="landing-hero">
            <h1>Search <br><i>Redefined.</i></h1>
            <button id="enter-app-btn" class="primary-btn-lg">Start Asking</button>
        </div>
    </div>

    <div id="main-app" class="app-container hidden-section">
        <header class="app-header">
            <button id="menu-toggle"><span class="material-icons-round">menu</span></button>
            <span class="app-title">SmartAI</span>
            <div id="user-profile"><span class="material-icons-round">account_circle</span></div>
        </header>

        <aside id="sidebar-overlay" class="sidebar-hidden">
            <div class="sidebar-content">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h3 style="font-size: 1.1rem;">History</h3>
                    <button id="close-sidebar" style="background:none; border:none;"><span class="material-icons-round">close</span></button>
                </div>
                <ul id="history-list" style="flex:1; overflow-y:auto; list-style:none;"></ul>
                <button id="clear-history" style="padding:10px; color:#ff3b30; background:none; border:none; cursor:pointer; font-weight:500;">Clear History</button>
            </div>
        </aside>

        <main class="chat-area">
            <div id="welcome-screen" class="welcome-container">
                <h2 class="greeting">What's on your mind?</h2>
            </div>

            <div id="loading" class="hidden">
                <p>Generating answer...</p>
            </div>

            <div id="result-container" class="hidden">
                <div class="chat-bubble user-bubble">
                    <p id="user-query-display"></p>
                </div>

                <div class="chat-bubble ai-bubble">
                    <div class="bubble-header">SmartAI Answer</div>
                    <div id="answer-text"></div>
                </div>

                <div class="info-card">
                    <h4><span class="material-icons-round" style="font-size:14px">link</span> SOURCES</h4>
                    <ul id="sources-list" class="source-list"></ul>
                </div>

                <div class="info-card">
                    <h4><span class="material-icons-round" style="font-size:14px">auto_awesome</span> RELATED</h4>
                    <ul id="similar-list" class="similar-list"></ul>
                </div>
                
                <div style="height: 100px;"></div>
            </div>
        </main>

        <div class="input-area-fixed">
            <form id="search-form" class="search-bar-wrapper">
                <input type="text" id="question-input" placeholder="Ask SmartAI..." autocomplete="off" required>
                <button type="submit" id="submit-btn">
                    <span class="material-icons-round">arrow_upward</span>
                </button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
