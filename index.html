<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Private Chat • Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ----- RESET & GLOBAL ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 30%, #1a1a2e, #0f0f1a);
            padding: 20px;
        }

        /* ----- LIQUID GLASS CARD ----- */
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border-radius: 48px;
            padding: 40px 36px;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: transform 0.25s ease, box-shadow 0.4s ease;
            animation: floatIn 0.9s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 80px -24px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        @keyframes floatIn {
            0% {
                opacity: 0;
                transform: scale(0.94) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ----- LOGO & HEADER ----- */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        .chat-header i {
            font-size: 2.2rem;
            color: #b3a0ff;
            filter: drop-shadow(0 0 12px rgba(140, 100, 255, 0.3));
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                filter: drop-shadow(0 0 8px rgba(140, 100, 255, 0.2));
            }
            100% {
                filter: drop-shadow(0 0 20px rgba(180, 130, 255, 0.5));
            }
        }

        .chat-header h1 {
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0ecff, #c8baff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-top: -10px;
            margin-bottom: 28px;
            border-left: 2px solid rgba(180, 140, 255, 0.3);
            padding-left: 14px;
        }

        /* ----- FORM ELEMENTS ----- */
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-group input:focus {
            border-color: rgba(160, 120, 255, 0.5);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 4px rgba(140, 100, 255, 0.08);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 300;
        }

        .input-group .icon-left {
            position: absolute;
            left: 18px;
            top: 42px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
        }

        .input-group input[type="text"],
        .input-group input[type="password"] {
            padding-left: 46px;
        }

        /* ----- CAPTCHA WRAPPER ----- */
        .captcha-wrap {
            margin: 24px 0 22px;
            padding: 16px 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            border: 1px dashed rgba(255, 255, 255, 0.06);
        }

        .captcha-wrap .fachapta {
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
        }

        /* ----- BUTTON ----- */
        .btn-login {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.05rem;
            background: linear-gradient(135deg, #7f66ff, #aa8aff);
            color: #fff;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(120, 80, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 32px rgba(120, 80, 255, 0.35);
            background: linear-gradient(135deg, #8f77ff, #b99aff);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login i {
            font-size: 1rem;
            transition: transform 0.3s ease;
        }

        .btn-login:hover i {
            transform: translateX(4px);
        }

        /* ----- SOCIAL / ALTERNATE ----- */
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 28px 0 16px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-freecloud {
            display: block;
            text-align: center;
            padding: 14px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .btn-freecloud:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.12);
        }

        .btn-freecloud i {
            margin-right: 10px;
            color: #a88cff;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 480px) {
            .glass-card {
                padding: 28px 20px;
                border-radius: 32px;
            }
            .chat-header h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <!-- header -->
        <div class="chat-header">
            <i class="fas fa-comment-dots"></i>
            <h1>Private Chat</h1>
        </div>
        <div class="subtitle">
            <i class="fas fa-lock" style="margin-right:8px;opacity:0.4;"></i> Masuk ke ruang aman
        </div>

        <!-- FORM LOGIN -->
        <form id="loginForm" method="POST" action="#">
            <div class="input-group">
                <label><i class="fas fa-user icon-left"></i> Username</label>
                <input type="text" id="username" placeholder="nama pengguna" required />
            </div>

            <div class="input-group">
                <label><i class="fas fa-key icon-left"></i> Password</label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>

            <!-- FaChapta widget -->
            <div class="captcha-wrap">
                <div class="fachapta" data-sitekey="fac_8ed1f054776e1193994b6264"></div>
                <script src="https://freecloud.order-rz.my.id/fachapta-widget.js"></script>
            </div>

            <button type="submit" class="btn-login">
                <span>Masuk</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="divider">atau</div>

        <!-- Login dengan FreeCloudi -->
        <a id="freecloudiLink" href="#" class="btn-freecloud">
            <i class="fas fa-cloud"></i> Login dengan FreeCloud
        </a>

        <p style="margin-top:24px;font-size:0.7rem;color:rgba(255,255,255,0.15);text-align:center;">
            <i class="fas fa-shield-alt" style="margin-right:6px;"></i> Dilindungi FaChapta
        </p>
    </div>

    <script>
        (function() {
            // ----------------------------------------------
            // 1. Siapkan link FreeCloudi
            //    Ganti client_id dan callback URL dengan milikmu
            // ----------------------------------------------
            const clientId = 'fci_98fc5db4fc8675320135'; // dari gambar kedua
            const callbackUrl = encodeURIComponent('https://buyer1.vercel.app/callback.html');
            // ⚠️ GANTI DENGAN URL ASLI MILIKMU, contoh: https://your-domain.com/callback.html

            const loginLink = document.getElementById('freecloudiLink');
            if (loginLink) {
                loginLink.href =
                    `https://freecloud.order-rz.my.id/FreeCloudi/login/${clientId}/url=${callbackUrl}`;
            }

            // ----------------------------------------------
            // 2. Handle login form (dengan verifikasi FaChapta)
            //    Karena kita pakai mode statis, kita verifikasi
            //    lewat fetch ke backend FreeCloud.
            // ----------------------------------------------
            const form = document.getElementById('loginForm');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();

                if (!username || !password) {
                    alert('Username dan password harus diisi.');
                    return;
                }

                // Ambil token captcha dari widget
                const captchaWidget = document.querySelector('.fachapta');
                let captchaResponse = '';
                if (captchaWidget && captchaWidget.dataset.fachaptaResponse) {
                    captchaResponse = captchaWidget.dataset.fachaptaResponse;
                }

                if (!captchaResponse) {
                    alert('Silakan selesaikan captcha terlebih dahulu.');
                    return;
                }

                // --- Verifikasi captcha ke FreeCloud ---
                const secretKey = 'fac_sd57b7a728a430bb0e64d0d938960861ffcfc43865320ffc0'; // dari gambar pertama

                try {
                    const verifyRes = await fetch('https://freecloud.order-rz.my.id/api/fachapta/siteverify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            secret: secretKey,
                            response: captchaResponse,
                        }),
                    });

                    const result = await verifyRes.json();

                    if (!result.success) {
                        alert('Verifikasi captcha gagal. Coba lagi.');
                        // Reset widget? biarkan user refresh manual
                        return;
                    }

                    // --- Jika captcha OK, lanjut login ke FreeCloud Auth ---
                    // Panggil /api/auth/login
                    const loginRes = await fetch('https://freecloud.order-rz.my.id/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: username,
                            password: password,
                        }),
                    });

                    const loginData = await loginRes.json();

                    if (loginRes.ok && loginData.token) {
                        // Simpan token JWT & user info ke localStorage
                        localStorage.setItem('fc_token', loginData.token);
                        localStorage.setItem('fc_username', username);
                        // Redirect ke halaman chat (index.html)
                        window.location.href = 'index.html';
                    } else {
                        alert('Login gagal: ' + (loginData.message || 'Periksa username/password.'));
                    }
                } catch (err) {
                    console.error('Error:', err);
                    alert('Terjadi kesalahan. Coba lagi nanti.');
                }
            });

        })();
    </script>

</body>
</html>
