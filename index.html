<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer1Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }
        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 95vh;
            background: #1a1a2e;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2a4a;
        }
        .chat-header {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .chat-header .user-info {
            font-size: 13px;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-header .user-info button {
            background: #ff6b6b;
            border: none;
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: 0.3s;
        }
        .chat-header .user-info button:hover {
            background: #ee5a24;
        }
        .chat-messages {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            background: #12121f;
        }
        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #6c5ce7;
            border-radius: 10px;
        }
        .message {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
        }
        .message .msg-sender {
            font-size: 12px;
            font-weight: 600;
            color: #a29bfe;
            margin-bottom: 3px;
        }
        .message .msg-text {
            background: #2d2d44;
            padding: 10px 16px;
            border-radius: 16px;
            border-top-left-radius: 4px;
            max-width: 85%;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 15px;
        }
        .message.own .msg-text {
            background: #6c5ce7;
            border-top-left-radius: 16px;
            border-top-right-radius: 4px;
            align-self: flex-end;
        }
        .message.own .msg-sender {
            align-self: flex-end;
        }
        .message .msg-file {
            max-width: 85%;
            border-radius: 12px;
            margin-top: 4px;
        }
        .message .msg-file img,
        .message .msg-file video {
            max-width: 100%;
            border-radius: 12px;
            max-height: 300px;
        }
        .message .msg-file a {
            display: inline-block;
            padding: 10px 16px;
            background: #2d2d44;
            border-radius: 12px;
            color: #a29bfe;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #3a3a5a;
        }
        .message .msg-file a:hover {
            background: #3a3a5a;
        }
        .chat-input {
            padding: 12px 16px;
            background: #1a1a2e;
            border-top: 1px solid #2a2a4a;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .chat-input input[type="text"] {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #3a3a5a;
            border-radius: 30px;
            background: #0f0f1a;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            min-width: 100px;
        }
        .chat-input input[type="text"]:focus {
            border-color: #6c5ce7;
        }
        .chat-input input[type="text"]::placeholder {
            color: #666;
        }
        .chat-input .file-label {
            padding: 10px 12px;
            background: #2d2d44;
            border-radius: 30px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
            border: 1px solid #3a3a5a;
        }
        .chat-input .file-label:hover {
            background: #3a3a5a;
        }
        .chat-input #fileInput {
            display: none;
        }
        .chat-input .file-name {
            font-size: 11px;
            color: #888;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .chat-input button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border: none;
            border-radius: 30px;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }
        .chat-input button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        .chat-input button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .login-prompt {
            text-align: center;
            padding: 40px 20px;
        }
        .login-prompt h2 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #a29bfe;
        }
        .login-prompt p {
            color: #aaa;
            margin-bottom: 24px;
        }
        .login-prompt a {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 16px;
            transition: 0.3s;
        }
        .login-prompt a:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4);
        }
        .empty-chat {
            text-align: center;
            color: #555;
            margin-top: 60px;
            font-size: 14px;
        }
        .loading {
            text-align: center;
            color: #666;
            margin-top: 40px;
            font-size: 14px;
        }
        .upload-progress {
            font-size: 12px;
            color: #a29bfe;
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- HEADER -->
        <div class="chat-header">
            <h1>💬 Buyer1Chat</h1>
            <div class="user-info" id="userInfo">
                <span id="usernameDisplay">Loading...</span>
                <button id="logoutBtn" style="display:none;" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- MESSAGES -->
        <div class="chat-messages" id="chatMessages">
            <div class="loading">Memuat pesan...</div>
        </div>

        <!-- INPUT -->
        <div class="chat-input">
            <label class="file-label" id="fileLabel" title="Kirim file (foto/video/dokumen)">
                📎
                <input type="file" id="fileInput" accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.zip,.rar,.txt">
            </label>
            <span class="file-name" id="fileName">Tidak ada file</span>
            <input type="text" id="messageInput" placeholder="Ketik pesan..." disabled>
            <button id="sendBtn" disabled onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  KONFIGURASI
        // ============================================================
        const CLOUD_ID = 'proj_6fa34276519565b01e02';
        const FREE_API = 'fapi_67a93e7a8c281ecf750b7852582d4ebb59549b0f';
        const BASE_URL = `https://freecloud.order-rz.my.id/api/cloudbase/${CLOUD_ID}`;

        // ============================================================
        //  CEK LOGIN
        // ============================================================
        let currentUser = null;
        const userData = localStorage.getItem('buyer1chat_user');

        if (userData) {
            try {
                currentUser = JSON.parse(userData);
                document.getElementById('usernameDisplay').textContent = '👤 ' + currentUser.username;
                document.getElementById('logoutBtn').style.display = 'inline-block';
                document.getElementById('messageInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
            } catch (e) {
                localStorage.removeItem('buyer1chat_user');
                currentUser = null;
            }
        }

        if (!currentUser) {
            document.getElementById('chatMessages').innerHTML = `
                <div class="login-prompt">
                    <h2>🔐 Login Dulu Yuk!</h2>
                    <p>Pakai akun FreeCloud kamu untuk masuk ke Buyer1Chat</p>
                    <a href="login.html">Login dengan FreeCloud</a>
                </div>
            `;
            document.getElementById('usernameDisplay').textContent = '🚫 Belum Login';
        }

        // ============================================================
        //  FUNGSI LOGOUT
        // ============================================================
        function logout() {
            localStorage.removeItem('buyer1chat_user');
            window.location.href = 'index.html';
        }

        // ============================================================
        //  TAMPILAN FILE YANG DIPILIH
        // ============================================================
        document.getElementById('fileInput').addEventListener('change', function() {
            const name = this.files[0] ? this.files[0].name : 'Tidak ada file';
            document.getElementById('fileName').textContent = name;
        });

        // ============================================================
        //  UPLOAD FILE KE CLOUDBASE
        // ============================================================
        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            const res = await fetch(`${BASE_URL}/upload?freeapi=${FREE_API}`, {
                method: 'POST',
                body: formData
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error('Upload gagal: ' + errText);
            }

            const data = await res.json();
            return data.fileId; // ID file dari response
        }

        // ============================================================
        //  AMBIL PESAN (dari Cloudbase Documents)
        // ============================================================
        async function loadMessages() {
            if (!currentUser) return;

            try {
                const res = await fetch(`${BASE_URL}/doc/messages?freeapi=${FREE_API}`);
                if (!res.ok) throw new Error('Gagal ambil data');

                const data = await res.json();
                const container = document.getElementById('chatMessages');

                if (!data || typeof data !== 'object' || Object.keys(data).length === 0) {
                    container.innerHTML = `<div class="empty-chat">Belum ada pesan. Jadilah yang pertama! 🎉</div>`;
                    return;
                }

                const messages = Object.entries(data)
                    .map(([key, val]) => ({ ...val, _key: key }))
                    .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                let html = '';
                for (const msg of messages) {
                    const isOwn = msg.uid === currentUser.uid;
                    html += `<div class="message ${isOwn ? 'own' : ''}">`;
                    html += `<span class="msg-sender">${isOwn ? '👤 Kamu' : '👤 ' + (msg.username || 'Unknown')}</span>`;

                    // Jika ada file
                    if (msg.fileId) {
                        const fileUrl = `${BASE_URL}/download/${msg.fileId}?freeapi=${FREE_API}`;
                        const isImage = msg.fileType && msg.fileType.startsWith('image/');
                        const isVideo = msg.fileType && msg.fileType.startsWith('video/');

                        if (isImage) {
                            html += `<div class="msg-file"><img src="${fileUrl}" alt="${msg.fileName || 'Gambar'}" loading="lazy"></div>`;
                        } else if (isVideo) {
                            html += `<div class="msg-file"><video controls src="${fileUrl}"></video></div>`;
                        } else {
                            html += `<div class="msg-file"><a href="${fileUrl}" target="_blank">📄 ${msg.fileName || 'Download File'}</a></div>`;
                        }
                    }

                    // Jika ada teks
                    if (msg.text) {
                        html += `<span class="msg-text">${escapeHtml(msg.text)}</span>`;
                    }

                    html += `</div>`;
                }

                container.innerHTML = html;
                container.scrollTop = container.scrollHeight;

            } catch (err) {
                console.error('Gagal load pesan:', err);
                document.getElementById('chatMessages').innerHTML = `
                    <div class="empty-chat">⚠️ Gagal memuat pesan. Coba refresh.</div>
                `;
            }
        }

        // ============================================================
        //  KIRIM PESAN (TEKS + FILE)
        // ============================================================
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!text && !file) {
                alert('Tulis pesan atau pilih file dulu!');
                return;
            }
            if (!currentUser) {
                alert('Login dulu!');
                return;
            }

            // Disable tombol sementara
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.textContent = 'Mengirim...';

            try {
                let fileId = null;
                let fileName = null;
                let fileType = null;

                // Upload file dulu jika ada
                if (file) {
                    const progressMsg = document.getElementById('fileName');
                    progressMsg.textContent = '⏳ Uploading...';

                    fileId = await uploadFile(file);
                    fileName = file.name;
                    fileType = file.type;

                    progressMsg.textContent = '✅ Upload selesai!';
                }

                // Siapkan payload
                const payload = {
                    uid: currentUser.uid,
                    username: currentUser.username,
                    text: text || '',
                    timestamp: Date.now()
                };

                if (fileId) {
                    payload.fileId = fileId;
                    payload.fileName = fileName;
                    payload.fileType = fileType;
                }

                // Kirim ke database
                const res = await fetch(`${BASE_URL}/doc/messages?freeapi=${FREE_API}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error('Gagal kirim pesan');

                // Reset input
                input.value = '';
                fileInput.value = '';
                document.getElementById('fileName').textContent = 'Tidak ada file';

                // Refresh chat
                await loadMessages();

            } catch (err) {
                alert('❌ Gagal kirim: ' + err.message);
                console.error(err);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Kirim';
            }
        }

        // ============================================================
        //  UTILITY: ESCAPE HTML
        // ============================================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        //  EVENT LISTENER
        // ============================================================
        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        // ============================================================
        //  POLLING (refresh tiap 4 detik)
        // ============================================================
        if (currentUser) {
            loadMessages();
            setInterval(loadMessages, 4000);
        }
    </script>

</body>
</html>
