<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunan AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-4">
    <div id="app" class="max-w-xl mx-auto flex flex-col h-screen">
        
        <div id="login-view" class="flex-1 flex flex-col items-center justify-center">
            <h1 class="text-5xl font-black text-blue-500 mb-6">LUNAN AI</h1>
            <button onclick="login()" class="bg-white text-black px-8 py-3 rounded-xl font-bold">Login Google</button>
        </div>

        <div id="chat-view" class="hidden flex-1 flex flex-col overflow-hidden">
            <div id="chat-box" class="flex-1 overflow-y-auto space-y-4 py-4"></div>
            <div class="p-4 bg-gray-900 rounded-2xl flex gap-2 mb-4">
                <input id="input-q" class="bg-transparent flex-1 outline-none" placeholder="Tanya sesuatu...">
                <button onclick="askLunan()" id="btn" class="bg-blue-600 px-4 py-2 rounded-lg">Kirim</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
        import { getDatabase, ref, push, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3IrREql-1PG1DhZQZklptxITQz_wOHZM",
            authDomain: "lunan-b6bfe.firebaseapp.com",
            databaseURL: "https://lunan-b6bfe-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lunan-b6bfe",
            appId: "1:705568398185:web:b4cc60ac49a5e718277bf8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getDatabase(app);
        let userNow = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userNow = user;
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('chat-view').classList.remove('hidden');
                loadHistory(user.uid);
            }
        });

        function loadHistory(uid) {
            onValue(query(ref(db, `chats/${uid}`), limitToLast(15)), (snap) => {
                const box = document.getElementById('chat-box');
                box.innerHTML = "";
                snap.forEach(c => {
                    const d = c.val();
                    box.innerHTML += `<div class="text-right text-blue-400"><b>Anda:</b> ${d.q}</div>`;
                    box.innerHTML += `<div class="bg-gray-800 p-3 rounded-lg mb-2"><b>Lunan:</b> ${d.a}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        window.login = () => signInWithPopup(auth, new GoogleAuthProvider());

        window.askLunan = async () => {
            const q = document.getElementById('input-q').value;
            if(!q) return;

            // 1. Dapatkan berita (bisa pakai API publik atau lewati jika hanya chat)
            const contextText = "Berita terbaru sedang dimuat..."; 

            // 2. Panggil Vercel API (Groq)
            const res = await fetch('/api', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: q, context: contextText })
            });
            const data = await res.json();

            // 3. Simpan ke Database (Langsung dari Frontend)
            await push(ref(db, `chats/${userNow.uid}`), {
                q: q,
                a: data.answer,
                t: Date.now()
            });

            document.getElementById('input-q').value = "";
        };
    </script>
</body>
</html>
