<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lunan AI | Next Gen Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root { 
            --bg-main: #212121; 
            --bg-side: #171717; 
            --accent: #3b82f6;
            --bubble-user: #2f2f2f;
            --bubble-ai: #1e2a3a;
        }
        
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); color: #ececf1; margin: 0; overflow-x: hidden; }
        
        /* Custom scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1f1f1f; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 20px; }
        
        /* Sidebar animation */
        .sidebar { background-color: var(--bg-side); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 60; }
        
        /* Chat bubbles */
        .bubble { max-width: 88%; line-height: 1.6; transition: all 0.2s; }
        .bubble-user { background: var(--bubble-user); border-radius: 1.5rem; padding: 0.8rem 1.2rem; border-bottom-right-radius: 0.25rem; }
        .bubble-ai { background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.2); border-radius: 1.5rem; padding: 0.8rem 1.2rem; border-bottom-left-radius: 0.25rem; }
        
        /* Typing indicator */
        .typing-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
        
        /* Source cards */
        .source-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 1rem; transition: all 0.2s; cursor: pointer; backdrop-filter: blur(4px); }
        .source-card:hover { background: rgba(59,130,246,0.15); border-color: var(--accent); transform: translateY(-2px); }
        
        /* Interactive */
        button:active { transform: scale(0.96); }
        .sidebar-item:hover { background: rgba(255,255,255,0.05); border-radius: 0.75rem; }
        
        /* Fade animations */
        .fade-enter { opacity: 0; transform: translateY(10px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: all 0.4s ease-out; }
        
        /* Glow effect */
        .glow-text { text-shadow: 0 0 8px rgba(59,130,246,0.5); }
    </style>
</head>
<body class="antialiased overflow-hidden">

    <!-- MAIN APP WRAPPER (initially hidden until landing dismissed) -->
    <div id="app-wrapper" class="hidden">
        <div id="app" class="flex h-screen w-full relative">
        
            <!-- SIDEBAR -->
            <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 w-72 transform -translate-x-full lg:translate-x-0 lg:relative flex flex-col border-r border-white/5">
                <div class="p-4">
                    <button onclick="resetConversation()" class="flex items-center justify-center gap-3 w-full bg-white/5 border border-white/10 p-3 rounded-xl hover:bg-white/10 transition-all font-bold text-sm">
                        <i class="fa-solid fa-plus text-blue-500"></i> Percakapan Baru
                    </button>
                </div>
                
                <div id="history-list" class="flex-1 overflow-y-auto px-3 space-y-1 no-scrollbar text-xs"></div>

                <div class="p-4 border-t border-white/10 space-y-3 bg-black/20">
                    <div class="flex items-center gap-3 px-2">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg" id="u-ico">?</div>
                        <div class="truncate">
                            <p class="text-[10px] font-bold text-gray-400 leading-none mb-1">PENGGUNA</p>
                            <p class="text-xs font-bold leading-none truncate text-white" id="u-name">Memuat...</p>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="w-full p-3 rounded-xl bg-red-500/10 text-red-400 text-[11px] font-black uppercase tracking-widest hover:bg-red-500/20 transition-all">
                        <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i> Keluar Sesi
                    </button>
                </div>
            </aside>

            <!-- MAIN CHAT AREA -->
            <main class="flex-1 flex flex-col relative h-full overflow-hidden">
                <!-- Mobile Header -->
                <header class="lg:hidden flex items-center justify-between px-5 py-4 border-b border-white/5 bg-[#212121]/90 backdrop-blur-md sticky top-0 z-40">
                    <button id="menu-toggle" onclick="toggleSidebar()" class="p-2 -ml-2"><i class="fa-solid fa-bars-staggered text-xl"></i></button>
                    <h1 class="text-lg font-black tracking-tighter bg-gradient-to-r from-blue-400 to-blue-600 bg-clip-text text-transparent italic">LUNAN AI</h1>
                    <button onclick="resetConversation()" class="p-2 -mr-2"><i class="fa-solid fa-rotate-right opacity-40 text-lg"></i></button>
                </header>

                <!-- Chat Scroll Container -->
                <div id="chat-container" class="flex-1 overflow-y-auto custom-scroll scroll-smooth">
                    <div id="welcome-view" class="h-full flex flex-col items-center justify-center text-center space-y-5 px-10">
                        <div class="w-20 h-20 rounded-[2rem] bg-blue-500/10 flex items-center justify-center border border-blue-500/30 shadow-2xl shadow-blue-500/10">
                            <i class="fa-solid fa-brain text-4xl text-blue-500"></i>
                        </div>
                        <div class="space-y-2">
                            <h2 class="text-xl font-bold tracking-tight text-white">Neural Core Active</h2>
                            <p class="text-xs text-gray-400 max-w-xs">Kecerdasan adaptif siap membantu Anda.</p>
                        </div>
                    </div>
                    <div id="message-flow" class="max-w-3xl mx-auto w-full pt-6"></div>
                    <div class="h-44"></div>
                </div>

                <!-- Input Area -->
                <div class="absolute bottom-0 left-0 w-full p-4 lg:p-6 bg-gradient-to-t from-[#212121] via-[#212121] to-transparent pointer-events-none">
                    <div class="max-w-3xl mx-auto pointer-events-auto">
                        <div class="bg-[#2f2f2f] rounded-3xl border border-white/10 shadow-2xl overflow-hidden focus-within:border-blue-500/60 transition duration-300">
                            <div class="flex items-end px-4 py-3 gap-3">
                                <textarea id="user-input" rows="1" 
                                    class="bg-transparent flex-1 py-2 outline-none resize-none text-sm md:text-base no-scrollbar min-h-[40px] max-h-[120px] placeholder:text-gray-500" 
                                    placeholder="Tanyakan apapun... berita, kode, atau wawasan..." 
                                    oninput="autoResize(this)"></textarea>
                                <button id="send-btn" onclick="processChat()" 
                                    class="bg-blue-600 text-white w-10 h-10 md:w-11 md:h-11 flex items-center justify-center rounded-2xl hover:bg-blue-500 transition active:scale-90 disabled:opacity-30 disabled:grayscale shadow-lg shadow-blue-600/20">
                                    <i class="fa-solid fa-arrow-up"></i>
                                </button>
                            </div>
                        </div>
                        <p class="text-[9px] text-center text-gray-600 mt-3 font-bold uppercase tracking-wider">⚡ Powered by Groq & Lunan Core v3.0</p>
                    </div>
                </div>
            </main>

            <div id="sidebar-overlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[55] hidden" onclick="toggleSidebar()"></div>
        </div>
    </div>

    <!-- LANDING PAGE (Modern Intro) -->
    <div id="landing-page" class="fixed inset-0 bg-gradient-to-br from-[#0a0a0a] to-[#171717] z-[110] flex flex-col items-center justify-center p-6 transition-all duration-700">
        <div class="space-y-8 text-center max-w-sm w-full">
            <div class="relative">
                <div class="absolute inset-0 bg-blue-600 rounded-[3rem] blur-3xl opacity-20 animate-pulse"></div>
                <div class="w-32 h-32 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-[2.5rem] mx-auto flex items-center justify-center shadow-2xl transform rotate-3 hover:rotate-6 transition-all duration-500">
                    <i class="fa-solid fa-brain text-6xl text-white drop-shadow-lg"></i>
                </div>
            </div>
            <h1 class="text-6xl font-black italic tracking-tighter"><span class="text-white">LUNAN</span> <span class="text-blue-500">AI</span></h1>
            <p class="text-gray-400 font-medium max-w-xs mx-auto leading-relaxed">Generasi baru kecerdasan buatan. Cepat, akurat, dan beradaptasi dengan kebutuhan Anda.</p>
            <button onclick="enterApp()" class="group px-10 py-4 bg-white text-black font-black rounded-full hover:bg-blue-500 hover:text-white transition-all transform hover:scale-105 shadow-xl flex items-center justify-center gap-3 mx-auto">
                <span>AKTIFKAN AI</span>
                <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition"></i>
            </button>
            <p class="text-[10px] text-gray-600 mt-4">© 2025 Lunan Intelligence • Private & Secure</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
        import { getDatabase, ref, push, onValue, query, limitToLast, get, set } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3IrREql-1PG1DhZQZklptxITQz_wOHZM",
            authDomain: "lunan-b6bfe.firebaseapp.com",
            databaseURL: "https://lunan-b6bfe-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lunan-b6bfe",
            appId: "1:705568398185:web:b4cc60ac49a5e718277bf8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getDatabase(app);
        let activeUser = null;
        let currentWaitId = null;

        // Global reset function
        window.resetConversation = () => {
            const flowDiv = document.getElementById('message-flow');
            if(flowDiv) flowDiv.innerHTML = '';
            document.getElementById('welcome-view').classList.remove('hidden');
            const textarea = document.getElementById('user-input');
            if(textarea) { textarea.value = ''; autoResize(textarea); }
            document.getElementById('send-btn').disabled = true;
        };

        // Auth State Handler
        onAuthStateChanged(auth, user => {
            if(user) {
                activeUser = user;
                document.getElementById('app-wrapper').classList.remove('hidden');
                document.getElementById('u-name').innerText = user.displayName || user.email.split('@')[0];
                document.getElementById('u-ico').innerText = (user.displayName ? user.displayName.charAt(0) : user.email.charAt(0)).toUpperCase();
                syncHistory();
            } else {
                document.getElementById('app-wrapper').classList.add('hidden');
                // keep landing if not logged in? but landing is separate.
            }
        });

        window.handleLogin = () => signInWithPopup(auth, new GoogleAuthProvider());
        window.handleLogout = () => signOut(auth).then(() => { location.reload(); });
        
        // Sidebar toggle
        window.toggleSidebar = () => {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('sidebar-overlay');
            const isOpen = !sb.classList.contains('-translate-x-full');
            if(isOpen) {
                sb.classList.add('-translate-x-full');
                ov.classList.add('hidden');
            } else {
                sb.classList.remove('-translate-x-full');
                ov.classList.remove('hidden');
            }
        };

        window.autoResize = (el) => {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
            const sendBtn = document.getElementById('send-btn');
            if(sendBtn) sendBtn.disabled = !el.value.trim();
        };

        // Typing Indicator
        function showWait() {
            if(currentWaitId) {
                const old = document.getElementById(currentWaitId);
                if(old) old.remove();
            }
            const flow = document.getElementById('message-flow');
            const id = "wait-" + Date.now();
            currentWaitId = id;
            flow.innerHTML += `
                <div id="${id}" class="flex gap-4 px-4 py-6">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#10a37f] to-emerald-700 flex items-center justify-center text-white shadow-lg shrink-0">L</div>
                    <div class="flex gap-1.5 items-center bg-[#2a2a2a] px-5 py-3 rounded-2xl rounded-tl-none border border-white/5">
                        <div class="typing-dot"></div><div class="typing-dot" style="animation-delay:0.2s"></div><div class="typing-dot" style="animation-delay:0.4s"></div>
                    </div>
                </div>`;
            scrollToBottom();
        }

        function removeWait() {
            if(currentWaitId) {
                const el = document.getElementById(currentWaitId);
                if(el) el.remove();
                currentWaitId = null;
            }
        }

        function renderBubble(role, text, sources = []) {
            removeWait();
            const flow = document.getElementById('message-flow');
            const isAi = role === 'ai';
            document.getElementById('welcome-view')?.classList.add('hidden');
            
            let sourcesHtml = '';
            if(isAi && sources && sources.length > 0) {
                sourcesHtml = `<div class="mt-4 flex flex-wrap gap-2 items-center">`;
                sources.forEach((s, idx) => {
                    const link = s.link || s.url || '#';
                    const title = s.title || s.name || `Sumber ${idx+1}`;
                    sourcesHtml += `<a href="${link}" target="_blank" rel="noopener noreferrer" class="source-card p-2 px-3 flex items-center gap-2 max-w-[180px] text-[11px]">
                        <i class="fa-solid fa-link text-blue-400 text-[9px]"></i>
                        <span class="truncate font-medium">${title.substring(0, 30)}</span>
                    </a>`;
                });
                sourcesHtml += `</div><div class="flex items-center gap-2 mt-3 text-[10px] text-blue-400/80 font-semibold"><i class="fa-solid fa-database"></i> <span>Basis Pengetahuan Lunan • Real-time</span></div>`;
            }
            
            const bubbleClass = !isAi ? 'bubble-user' : 'bubble-ai';
            const iconClass = isAi ? 'fa-robot' : 'fa-user';
            const bgGradient = !isAi ? 'bg-blue-600' : 'bg-gradient-to-br from-[#10a37f] to-[#0d8a6f]';
            
            flow.innerHTML += `
                <div class="flex gap-4 px-4 py-6 ${!isAi ? 'flex-row-reverse' : ''} fade-enter fade-enter-active">
                    <div class="w-9 h-9 rounded-xl ${bgGradient} flex items-center justify-center text-white shadow-lg shrink-0">
                        <i class="fa-solid ${iconClass} text-sm"></i>
                    </div>
                    <div class="bubble ${bubbleClass} max-w-[85%]">
                        <div class="text-[9px] opacity-40 mb-1 font-black tracking-widest uppercase">${role === 'user' ? 'ANDA' : 'LUNAN AI'}</div>
                        <div class="text-sm md:text-base whitespace-pre-wrap leading-relaxed">${text.replace(/\n/g, '<br>')}</div>
                        ${sourcesHtml}
                    </div>
                </div>`;
            scrollToBottom();
        }

        async function saveToBrain(question, answer) {
            if(!activeUser) return;
            try {
                await push(ref(db, 'brain'), { topic: question.toLowerCase(), content: answer, timestamp: Date.now() });
            } catch(e) { console.warn("Brain save error", e); }
        }

        // Main Chat Logic (Integration with Vercel API + Brain fallback)
        window.processChat = async () => {
            if(!activeUser) {
                alert("Silakan login terlebih dahulu.");
                return;
            }
            const input = document.getElementById('user-input');
            const question = input.value.trim();
            if(!question) return;
            
            // Disable send button during process
            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;
            
            // Render user bubble
            renderBubble('user', question);
            input.value = "";
            input.style.height = "auto";
            
            showWait();
            
            try {
                // 1. Check local brain memory (exact topic match only)
                const brainSnap = await get(ref(db, 'brain'));
                const brainData = brainSnap.val();
                let localAnswer = null;
                const cleanQ = question.toLowerCase().trim();
                if(brainData) {
                    for(let key in brainData) {
                        if(brainData[key].topic && brainData[key].topic.toLowerCase() === cleanQ) {
                            localAnswer = brainData[key].content;
                            break;
                        }
                    }
                }
                
                if(localAnswer) {
                    setTimeout(() => {
                        renderBubble('ai', localAnswer, []);
                        saveChatHistory(question, localAnswer);
                    }, 300);
                } else {
                    // 2. Call Vercel Edge Function (/api)
                    const res = await fetch('/api', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            question: question,
                            userId: activeUser.uid,
                            context: "Berikan jawaban akurat, gaya inovatif dan terkini."
                        })
                    });
                    
                    if(!res.ok) throw new Error(`API respond ${res.status}`);
                    const data = await res.json();
                    const aiAnswer = data.answer || "Maaf, saya tidak memiliki jawaban saat ini.";
                    const sources = data.sources || [];
                    
                    renderBubble('ai', aiAnswer, sources);
                    saveChatHistory(question, aiAnswer);
                    await saveToBrain(question, aiAnswer);
                }
            } catch(error) {
                console.error("Chat error:", error);
                renderBubble('ai', "⚠️ Gangguan koneksi atau API tidak tersedia. Coba lagi nanti.", []);
            } finally {
                sendBtn.disabled = false;
                autoResize(document.getElementById('user-input'));
            }
        };
        
        async function saveChatHistory(q, a) {
            if(!activeUser) return;
            try {
                const chatRef = ref(db, `chats/${activeUser.uid}`);
                await push(chatRef, { q, a, timestamp: Date.now() });
                syncHistory(); // refresh sidebar
            } catch(e) { console.warn(e); }
        }
        
        function syncHistory() {
            if(!activeUser) return;
            const historyRef = query(ref(db, `chats/${activeUser.uid}`), limitToLast(15));
            onValue(historyRef, (snapshot) => {
                const listDiv = document.getElementById('history-list');
                if(!listDiv) return;
                listDiv.innerHTML = '';
                const items = [];
                snapshot.forEach(child => items.push(child.val()));
                // show recent on top? reverse for latest first but we want newest at top
                items.reverse().forEach(doc => {
                    if(doc.q) {
                        const div = document.createElement('div');
                        div.className = "p-3 rounded-xl sidebar-item truncate flex items-center gap-3 transition cursor-pointer hover:bg-white/5";
                        div.innerHTML = `<i class="fa-regular fa-comment opacity-30 text-[10px]"></i><span class="truncate text-gray-300 text-xs">${doc.q.substring(0, 45)}</span>`;
                        div.onclick = () => {
                            // restore conversation preview (just scroll UI, not fully load conversation history - simple)
                            alert("Riwayat percakapan: " + doc.q + "\n\n" + (doc.a || "Balasan AI tersimpan."));
                        };
                        listDiv.appendChild(div);
                    }
                });
                if(items.length === 0) {
                    listDiv.innerHTML = '<div class="text-center text-gray-500 text-[11px] py-8 opacity-50">✨ Belum ada percakapan</div>';
                }
            }, { onlyOnce: false });
        }
        
        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            if(container) setTimeout(() => container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' }), 50);
        }
        
        // Expose logout to window
        window.handleLogout = () => signOut(auth).then(() => location.reload());
        
        // Initial event binding after DOM
        document.addEventListener('DOMContentLoaded', () => {
            const textarea = document.getElementById('user-input');
            if(textarea) {
                textarea.addEventListener('keydown', (e) => {
                    if(e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        if(!document.getElementById('send-btn').disabled) processChat();
                    }
                });
            }
        });
    </script>

    <script>
        // Landing & Integration functions (pure JS)
        function enterApp() {
            const landing = document.getElementById('landing-page');
            if(landing) {
                landing.style.opacity = '0';
                landing.style.pointerEvents = 'none';
                setTimeout(() => {
                    landing.style.display = 'none';
                    landing.remove();
                    // Check if user already logged in else login modal is active via firebase state
                    // The login modal is inside index but we manage via firebase onAuthStateChanged.
                    // However hardcoded login-modal element is missing? But original code had login-modal.
                    // We'll insert login modal fallback if needed. To ensure seamless: 
                    // The app wrapper may show before login if not logged. So force checking.
                    const wrapper = document.getElementById('app-wrapper');
                    if(wrapper && wrapper.classList.contains('hidden')) {
                        // show login modal if not already visible?
                        if(!document.getElementById('login-modal')) {
                            const modalDiv = document.createElement('div');
                            modalDiv.id = 'login-modal';
                            modalDiv.className = 'fixed inset-0 bg-[#0a0a0a] z-[100] flex items-center justify-center p-6';
                            modalDiv.innerHTML = `
                                <div class="text-center space-y-8 max-w-xs w-full">
                                    <div class="w-24 h-24 bg-blue-600 rounded-[2.5rem] mx-auto flex items-center justify-center shadow-2xl shadow-blue-600/30 rotate-6">
                                        <i class="fa-solid fa-bolt text-5xl text-white"></i>
                                    </div>
                                    <h1 class="text-4xl font-black italic tracking-tighter text-white">LUNAN <span class="text-blue-500">AI</span></h1>
                                    <button onclick="window.handleLogin && handleLogin()" class="w-full bg-white text-black font-black py-5 rounded-[1.5rem] flex items-center justify-center gap-3 hover:bg-gray-100 transition active:scale-95 shadow-xl">
                                        <i class="fa-brands fa-google text-xl"></i> MASUK DENGAN GOOGLE
                                    </button>
                                </div>`;
                            document.body.appendChild(modalDiv);
                        }
                    }
                }, 500);
            }
        }

        // Fallback: make sure global enterApp available
        window.enterApp = enterApp;
        
        // If for any reason login-modal is not triggered, but landing removes fine.
        // Since original had seperate login-modal hiding using firebase state, we added conditional.
        // Additionally expose resetConversation
        window.resetConversation = window.resetConversation || function() {
            const flow = document.getElementById('message-flow');
            if(flow) flow.innerHTML = '';
            const welcome = document.getElementById('welcome-view');
            if(welcome) welcome.classList.remove('hidden');
            const textarea = document.getElementById('user-input');
            if(textarea) { textarea.value = ''; if(window.autoResize) autoResize(textarea); }
            const sendBtn = document.getElementById('send-btn');
            if(sendBtn) sendBtn.disabled = true;
        };
    </script>
</body>
</html>
