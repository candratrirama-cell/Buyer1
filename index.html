<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lunan AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        :root { --bg-main: #212121; --bg-side: #171717; --accent: #3b82f6; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-main); color: #ececf1; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Layout */
        .sidebar { background-color: var(--bg-side); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .bubble { max-width: 90%; line-height: 1.6; }
        .bubble-ai { background: transparent; }
        .bubble-user { background: #2f2f2f; border-radius: 1.5rem; padding: 0.8rem 1.2rem; }

        /* Typing & Animations */
        .dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-5px); } }
        
        /* Source Cards */
        .source-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 0.75rem; transition: all 0.2s; }
        .source-card:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }

        /* Responsive Textarea */
        #user-input { min-height: 24px; max-height: 200px; }
    </style>
</head>
<body class="antialiased overflow-hidden">

    <div id="app" class="flex h-screen w-full relative">
        
        <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 w-72 transform -translate-x-full lg:translate-x-0 lg:relative flex flex-col border-r border-white/5 z-50">
            <div class="p-4">
                <button onclick="location.reload()" class="flex items-center justify-center gap-2 w-full bg-white/5 border border-white/10 p-3 rounded-xl hover:bg-white/10 transition font-semibold text-sm">
                    <i class="fa-solid fa-plus text-blue-500"></i> New Conversation
                </button>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto px-3 space-y-1 no-scrollbar text-xs"></div>
            <div class="p-4 border-t border-white/10 space-y-3">
                <div class="flex items-center gap-3 px-2">
                    <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold" id="u-ico">?</div>
                    <div class="truncate"><p class="text-xs font-bold leading-none" id="u-name">User</p></div>
                </div>
                <button onclick="handleLogout()" class="w-full p-3 rounded-xl bg-red-500/10 text-red-400 text-xs font-bold hover:bg-red-500/20 transition">Logout</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative h-full overflow-hidden">
            
            <header class="lg:hidden flex items-center justify-between px-5 py-4 border-b border-white/5">
                <button onclick="toggleSidebar()"><i class="fa-solid fa-bars-staggered"></i></button>
                <h1 class="text-lg font-black tracking-tighter text-blue-500 italic">LUNAN AI</h1>
                <div class="w-5"></div>
            </header>

            <div id="chat-container" class="flex-1 overflow-y-auto no-scrollbar scroll-smooth px-4 md:px-0">
                <div id="welcome-view" class="h-full flex flex-col items-center justify-center text-center space-y-4 opacity-40">
                    <div class="w-16 h-16 rounded-3xl bg-blue-500/10 flex items-center justify-center border border-blue-500/20">
                        <i class="fa-solid fa-wind text-2xl text-blue-500"></i>
                    </div>
                    <p class="text-sm font-medium">How can I assist you today?</p>
                </div>
                <div id="message-flow" class="max-w-3xl mx-auto w-full pt-10"></div>
                <div class="h-48"></div>
            </div>

            <div class="absolute bottom-0 left-0 w-full p-4 lg:pb-10 bg-gradient-to-t from-[#212121] via-[#212121] to-transparent">
                <div class="max-w-3xl mx-auto relative">
                    <div class="bg-[#2f2f2f] rounded-[2rem] border border-white/10 shadow-2xl overflow-hidden focus-within:border-blue-500/50 transition">
                        <div class="flex items-end px-4 py-3 gap-2">
                            <textarea id="user-input" rows="1" class="bg-transparent flex-1 py-2 outline-none resize-none text-sm md:text-base no-scrollbar" placeholder="Type a message..." oninput="autoResize(this)"></textarea>
                            <button id="send-btn" onclick="processChat()" class="bg-blue-600 text-white w-10 h-10 flex items-center justify-center rounded-full hover:bg-blue-500 transition active:scale-90 disabled:opacity-20">
                                <i class="fa-solid fa-arrow-up"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden" onclick="toggleSidebar()"></div>
    </div>

    <div id="login-modal" class="fixed inset-0 bg-[#0a0a0a] z-[100] flex items-center justify-center p-6">
        <div class="text-center space-y-6 animate-pulse">
            <h1 class="text-6xl font-black italic text-blue-500">LUNAN</h1>
            <button onclick="handleLogin()" class="bg-white text-black font-bold px-10 py-4 rounded-full flex items-center gap-3">Continue with Google</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
        import { getDatabase, ref, push, onValue, query, limitToLast, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.app";

        const firebaseConfig = {
            apiKey: "AIzaSyC3IrREql-1PG1DhZQZklptxITQz_wOHZM",
            authDomain: "lunan-b6bfe.firebaseapp.com",
            databaseURL: "https://lunan-b6bfe-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lunan-b6bfe",
            appId: "1:705568398185:web:b4cc60ac49a5e718277bf8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getDatabase(app);
        let userNow = null;

        onAuthStateChanged(auth, u => {
            if(u) {
                userNow = u;
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('u-name').innerText = u.displayName;
                document.getElementById('u-ico').innerText = u.displayName.charAt(0);
                syncHistory();
            }
        });

        window.handleLogin = () => signInWithPopup(auth, new GoogleAuthProvider());
        window.handleLogout = () => signOut(auth).then(() => location.reload());
        
        window.toggleSidebar = () => {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('sidebar-overlay');
            sb.classList.toggle('-translate-x-full');
            ov.classList.toggle('hidden');
        };

        window.autoResize = (el) => {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
            document.getElementById('send-btn').disabled = !el.value.trim();
        };

        function showWait() {
            const flow = document.getElementById('message-flow');
            const html = `<div id="wait" class="flex gap-4 px-4 py-8"><div class="w-8 h-8 rounded bg-[#10a37f] flex items-center justify-center text-[10px]">L</div><div class="flex gap-1 items-center"><div class="dot"></div><div class="dot" style="animation-delay:0.2s"></div><div class="dot" style="animation-delay:0.4s"></div></div></div>`;
            flow.innerHTML += html;
            scrollToBottom();
        }

        function renderBubble(role, text, sources = []) {
            const wait = document.getElementById('wait');
            if (wait) wait.remove();

            const flow = document.getElementById('message-flow');
            const isAi = role === 'ai';
            
            let sourceHtml = '';
            if (isAi && sources && sources.length > 0) {
                sourceHtml = `<div class="mt-4 flex flex-wrap gap-2">`;
                sources.forEach((s, i) => {
                    sourceHtml += `<a href="${s.link}" target="_blank" class="source-card p-2 flex items-center gap-2 max-w-[150px]">
                        <span class="w-4 h-4 bg-white/10 rounded flex items-center justify-center text-[8px]">${i+1}</span>
                        <span class="truncate text-[10px] opacity-70">${s.title || 'Website'}</span>
                    </a>`;
                });
                sourceHtml += `</div><p class="mt-2 text-[10px] text-blue-400 font-bold italic">Dilangsir dari : Turboseek Intelligence</p>`;
            }

            const html = `
                <div class="flex gap-4 px-4 py-8 ${!isAi ? 'flex-row-reverse' : ''}">
                    <div class="w-8 h-8 rounded shrink-0 flex items-center justify-center font-bold text-xs ${isAi ? 'bg-[#10a37f]' : 'bg-blue-600'}">${isAi ? 'L' : 'U'}</div>
                    <div class="bubble ${!isAi ? 'bubble-user shadow-xl shadow-blue-500/5' : 'bubble-ai'}">
                        <div class="text-[10px] opacity-30 mb-1 font-bold uppercase tracking-widest">${role}</div>
                        <div class="text-sm md:text-base whitespace-pre-wrap">${text}</div>
                        ${sourceHtml}
                    </div>
                </div>`;
            flow.innerHTML += html;
            scrollToBottom();
        }

        window.processChat = async () => {
            const input = document.getElementById('user-input');
            const q = input.value.trim();
            if(!q) return;

            document.getElementById('welcome-view').classList.add('hidden');
            renderBubble('user', q);
            input.value = ""; input.style.height = 'auto';
            showWait();

            try {
                // BRAIN CHECK
                const brainSnap = await get(ref(db, 'brain'));
                const brain = brainSnap.val();
                let matched = null;

                if(brain) {
                    for(let id in brain) {
                        if(q.toLowerCase().includes(brain[id].topic.toLowerCase()) || brain[id].topic.toLowerCase().includes(q.toLowerCase())) {
                            matched = brain[id]; break;
                        }
                    }
                }

                if(matched) {
                    renderBubble('ai', matched.content);
                    await push(ref(db, `chats/${userNow.uid}`), { q, a: matched.content, t: Date.now() });
                } else {
                    const res = await fetch('/api', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ question: q })
                    });
                    const data = await res.json();
                    renderBubble('ai', data.answer, data.sources || []);
                    await push(ref(db, `chats/${userNow.uid}`), { q, a: data.answer, t: Date.now() });
                    await push(ref(db, 'brain'), { topic: q, content: data.answer, t: Date.now() });
                }
            } catch(e) { renderBubble('ai', 'Error connecting to brain.'); }
        };

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }

        function syncHistory() {
            onValue(query(ref(db, `chats/${userNow.uid}`), limitToLast(10)), s => {
                const list = document.getElementById('history-list');
                list.innerHTML = "";
                s.forEach(c => {
                    list.innerHTML = `<div class="p-3 rounded-xl hover:bg-white/5 truncate cursor-default flex items-center gap-2">
                        <i class="fa-regular fa-message opacity-30"></i> <span>${c.val().q}</span>
                    </div>` + list.innerHTML;
                });
            });
        }
    </script>
</body>
</html>
