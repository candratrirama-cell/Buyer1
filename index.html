<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunan AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-bg { background: radial-gradient(circle at top right, #1e1b4b, #000); }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-black text-white chat-bg min-h-screen">
    <div id="app" class="max-w-2xl mx-auto p-4 flex flex-col min-h-screen">
        
        <div id="login-screen" class="flex-1 flex flex-col items-center justify-center text-center">
            <h1 class="text-7xl font-black text-blue-500 mb-4 tracking-tighter">LUNAN</h1>
            <p class="text-gray-400 mb-10 text-lg">AI Terintegrasi Berita & Database Realtime</p>
            <button onclick="login()" class="bg-white text-black px-10 py-4 rounded-2xl font-bold hover:scale-105 transition shadow-xl shadow-blue-500/20">
                Masuk dengan Google
            </button>
        </div>

        <div id="chat-screen" class="hidden flex-1 flex flex-col h-full overflow-hidden">
            <header class="flex justify-between items-center py-6 border-b border-white/10">
                <div>
                    <h2 class="text-xl font-bold text-blue-400">Lunan Interface</h2>
                    <p id="user-email" class="text-[10px] text-gray-500"></p>
                </div>
                <button onclick="logout()" class="text-red-500 text-xs font-bold border border-red-500/30 px-3 py-1 rounded-lg">LOGOUT</button>
            </header>

            <div id="chat-container" class="flex-1 overflow-y-auto py-6 space-y-6"></div>

            <div class="glass p-3 rounded-3xl border border-white/10 flex gap-2 mb-4">
                <input id="input-msg" class="bg-transparent flex-1 px-4 outline-none text-sm" placeholder="Tanya Lunan AI...">
                <button onclick="send()" id="btn-send" class="bg-blue-600 p-3 rounded-2xl">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7-7 7M5 12h14"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
        import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        // GUNAKAN CONFIG ANDA SENDIRI
        const firebaseConfig = {
            apiKey: "AIzaSyC3IrREql-1PG1DhZQZklptxITQz_wOHZM",
            authDomain: "lunan-b6bfe.firebaseapp.com",
            databaseURL: "https://lunan-b6bfe-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lunan-b6bfe",
            appId: "1:705568398185:web:b4cc60ac49a5e718277bf8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const rtdb = getDatabase(app);
        let user = null;

        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('chat-screen').classList.remove('hidden');
                document.getElementById('user-email').innerText = u.email;
                loadHistory(u.uid);
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('chat-screen').classList.add('hidden');
            }
        });

        function loadHistory(uid) {
            onValue(query(ref(rtdb, `chats/${uid}`), limitToLast(20)), (s) => {
                const box = document.getElementById('chat-container');
                box.innerHTML = "";
                s.forEach(child => {
                    const data = child.val();
                    box.innerHTML += `<div class="text-right"><span class="bg-blue-600/20 text-blue-300 px-4 py-2 rounded-2xl rounded-tr-none inline-block text-sm">${data.q}</span></div>`;
                    box.innerHTML += `<div class="text-left"><span class="bg-white/5 border border-white/10 px-4 py-3 rounded-2xl rounded-tl-none inline-block text-sm leading-relaxed">${data.a}</span></div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        window.login = () => signInWithPopup(auth, new GoogleAuthProvider());
        window.logout = () => signOut(auth);

        window.send = async () => {
            const msg = document.getElementById('input-msg').value;
            if(!msg) return;
            document.getElementById('btn-send').disabled = true;
            await fetch('/api', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ question: msg, uid: user.uid })
            });
            document.getElementById('input-msg').value = "";
            document.getElementById('btn-send').disabled = false;
        };
    </script>
</body>
</html>
