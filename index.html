<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lunan AI | Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        :root { --bg-main: #212121; --bg-side: #171717; --accent: #3b82f6; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-main); color: #ececf1; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Layout Fixes */
        .sidebar { background-color: var(--bg-side); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 60; }
        .bubble { max-width: 88%; line-height: 1.6; transition: all 0.2s; }
        .bubble-user { background: #2f2f2f; border-radius: 1.25rem; padding: 0.8rem 1.1rem; border-bottom-right-radius: 0.25rem; }
        
        /* Animations */
        .typing-dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-5px); } }
        
        /* Interactive Elements */
        .source-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 0.75rem; transition: all 0.2s; cursor: pointer; }
        .source-card:hover { background: rgba(255,255,255,0.12); border-color: var(--accent); transform: translateY(-1px); }
        
        button:active { transform: scale(0.96); }
        .sidebar-item:hover { background: rgba(255,255,255,0.05); }
    </style>
</head>
<body class="antialiased overflow-hidden">

    <div id="app" class="flex h-screen w-full relative">
        
        <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 w-72 transform -translate-x-full lg:translate-x-0 lg:relative flex flex-col border-r border-white/5">
            <div class="p-4">
                <button onclick="location.reload()" class="flex items-center justify-center gap-3 w-full bg-white/5 border border-white/10 p-3 rounded-xl hover:bg-white/10 transition font-bold text-sm">
                    <i class="fa-solid fa-plus text-blue-500"></i> Percakapan Baru
                </button>
            </div>
            
            <div id="history-list" class="flex-1 overflow-y-auto px-3 space-y-1 no-scrollbar text-xs">
                </div>

            <div class="p-4 border-t border-white/10 space-y-3 bg-black/20">
                <div class="flex items-center gap-3 px-2">
                    <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg" id="u-ico">?</div>
                    <div class="truncate">
                        <p class="text-[11px] font-bold text-gray-400 leading-none mb-1">PENGGUNA</p>
                        <p class="text-xs font-bold leading-none truncate" id="u-name">Memuat...</p>
                    </div>
                </div>
                <button onclick="handleLogout()" class="w-full p-3 rounded-xl bg-red-500/10 text-red-400 text-[11px] font-black uppercase tracking-widest hover:bg-red-500/20 transition">
                    Keluar Sesi
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col relative h-full overflow-hidden">
            
            <header class="lg:hidden flex items-center justify-between px-5 py-4 border-b border-white/5 bg-[#212121]/80 backdrop-blur-md sticky top-0 z-40">
                <button id="menu-toggle" onclick="toggleSidebar()" class="p-2 -ml-2"><i class="fa-solid fa-bars-staggered text-xl"></i></button>
                <h1 class="text-lg font-black tracking-tighter text-blue-500 italic">LUNAN AI</h1>
                <button onclick="location.reload()" class="p-2 -mr-2"><i class="fa-solid fa-rotate-right opacity-40 text-lg"></i></button>
            </header>

            <div id="chat-container" class="flex-1 overflow-y-auto no-scrollbar scroll-smooth">
                <div id="welcome-view" class="h-full flex flex-col items-center justify-center text-center space-y-5 px-10 animate-pulse">
                    <div class="w-20 h-20 rounded-[2.5rem] bg-blue-500/10 flex items-center justify-center border border-blue-500/20 shadow-2xl">
                        <i class="fa-solid fa-brain text-4xl text-blue-500"></i>
                    </div>
                    <div class="space-y-1">
                        <h2 class="text-xl font-bold tracking-tight text-white">Neural Network Active</h2>
                        <p class="text-xs text-gray-500">Sistem siap menerima instruksi.</p>
                    </div>
                </div>
                <div id="message-flow" class="max-w-3xl mx-auto w-full pt-6"></div>
                <div class="h-44"></div> </div>

            <div class="absolute bottom-0 left-0 w-full p-4 lg:p-10 bg-gradient-to-t from-[#212121] via-[#212121] to-transparent pointer-events-none">
                <div class="max-w-3xl mx-auto pointer-events-auto">
                    <div class="bg-[#2f2f2f] rounded-3xl border border-white/10 shadow-2xl overflow-hidden focus-within:border-blue-500/50 transition duration-300">
                        <div class="flex items-end px-4 py-3 gap-3">
                            <textarea id="user-input" rows="1" 
                                class="bg-transparent flex-1 py-2 outline-none resize-none text-sm md:text-base no-scrollbar min-h-[40px]" 
                                placeholder="Tanyakan berita atau kode..." 
                                oninput="autoResize(this)"></textarea>
                            <button id="send-btn" onclick="processChat()" 
                                class="bg-blue-600 text-white w-10 h-10 md:w-11 md:h-11 flex items-center justify-center rounded-2xl hover:bg-blue-500 transition active:scale-90 disabled:opacity-20 disabled:grayscale">
                                <i class="fa-solid fa-arrow-up"></i>
                            </button>
                        </div>
                    </div>
                    <p class="text-[9px] text-center text-gray-600 mt-3 font-bold uppercase tracking-tighter">Powered by Groq & Turboseek v2.6</p>
                </div>
            </div>
        </main>

        <div id="sidebar-overlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[55] hidden" onclick="toggleSidebar()"></div>
    </div>

    <div id="login-modal" class="fixed inset-0 bg-[#0a0a0a] z-[100] flex items-center justify-center p-6">
        <div class="text-center space-y-8 max-w-xs w-full">
            <div class="w-24 h-24 bg-blue-600 rounded-[2.5rem] mx-auto flex items-center justify-center shadow-2xl shadow-blue-600/30 rotate-6">
                <i class="fa-solid fa-bolt text-5xl text-white"></i>
            </div>
            <h1 class="text-4xl font-black italic tracking-tighter text-white">LUNAN <span class="text-blue-500">AI</span></h1>
            <button onclick="handleLogin()" class="w-full bg-white text-black font-black py-5 rounded-[1.5rem] flex items-center justify-center gap-3 hover:bg-gray-100 transition active:scale-95 shadow-xl">
                <i class="fa-brands fa-google text-xl"></i> MASUK DENGAN GOOGLE
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
        import { getDatabase, ref, push, onValue, query, limitToLast, get } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3IrREql-1PG1DhZQZklptxITQz_wOHZM",
            authDomain: "lunan-b6bfe.firebaseapp.com",
            databaseURL: "https://lunan-b6bfe-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lunan-b6bfe",
            appId: "1:705568398185:web:b4cc60ac49a5e718277bf8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getDatabase(app);
        let activeUser = null;

        // AUTH & LOGOUT
        onAuthStateChanged(auth, user => {
            if(user) {
                activeUser = user;
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('u-name').innerText = user.displayName;
                document.getElementById('u-ico').innerText = user.displayName.charAt(0);
                syncHistory();
            } else {
                document.getElementById('login-modal').classList.remove('hidden');
            }
        });

        window.handleLogin = () => signInWithPopup(auth, new GoogleAuthProvider());
        window.handleLogout = () => signOut(auth).then(() => location.reload());
        
        // UI INTERACTION
        window.toggleSidebar = () => {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('sidebar-overlay');
            const isOpen = !sb.classList.contains('-translate-x-full');
            
            if(isOpen) {
                sb.classList.add('-translate-x-full');
                ov.classList.add('hidden');
            } else {
                sb.classList.remove('-translate-x-full');
                ov.classList.remove('hidden');
            }
        };

        window.autoResize = (el) => {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
            document.getElementById('send-btn').disabled = !el.value.trim();
        };

        // CORE LOGIC
        window.processChat = async () => {
            const input = document.getElementById('user-input');
            const q = input.value.trim();
            if(!q) return;

            document.getElementById('welcome-view').classList.add('hidden');
            renderBubble('user', q);
            input.value = ""; input.style.height = 'auto';
            document.getElementById('send-btn').disabled = true;

            showWait();

            try {
                // BRAIN CHECK (Exact Match Only for accuracy)
                const brainSnap = await get(ref(db, 'brain'));
                const brainData = brainSnap.val();
                let matched = null;

                if(brainData) {
                    const cleanQ = q.toLowerCase();
                    for(let id in brainData) {
                        if(cleanQ === brainData[id].topic.toLowerCase()) {
                            matched = brainData[id].content; break;
                        }
                    }
                }

                if(matched) {
                    setTimeout(() => renderBubble('ai', matched), 600);
                } else {
                    const res = await fetch('/api', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ question: q })
                    });
                    const data = await res.json();
                    renderBubble('ai', data.answer, data.sources || []);
                    
                    // Save Brain & History
                    await push(ref(db, `chats/${activeUser.uid}`), { q, a: data.answer, t: Date.now() });
                    await push(ref(db, 'brain'), { topic: q, content: data.answer, t: Date.now() });
                }
            } catch(e) { 
                renderBubble('ai', 'Maaf, sistem tidak merespon. Periksa API Vercel.'); 
            } finally {
                document.getElementById('send-btn').disabled = false;
            }
        };

        function showWait() {
            const flow = document.getElementById('message-flow');
            const id = "wait-"+Date.now();
            flow.innerHTML += `
                <div id="${id}" class="flex gap-4 px-4 py-8">
                    <div class="w-9 h-9 rounded-xl bg-[#10a37f] flex items-center justify-center text-white shadow-lg shrink-0">L</div>
                    <div class="flex gap-1.5 items-center bg-[#2f2f2f] px-5 rounded-2xl rounded-tl-none border border-white/5">
                        <div class="typing-dot"></div><div class="typing-dot" style="animation-delay:0.2s"></div><div class="typing-dot" style="animation-delay:0.4s"></div>
                    </div>
                </div>`;
            scrollToBottom();
            window.lastWaitId = id;
        }

        function renderBubble(role, text, sources = []) {
            if(window.lastWaitId) {
                const el = document.getElementById(window.lastWaitId);
                if(el) el.remove();
            }

            const flow = document.getElementById('message-flow');
            const isAi = role === 'ai';
            
            let sHtml = '';
            if(isAi && sources.length > 0) {
                sHtml = `<div class="mt-4 flex flex-wrap gap-2">`;
                sources.forEach((s, i) => {
                    sHtml += `<a href="${s.link}" target="_blank" class="source-card p-2 px-3 flex items-center gap-2 max-w-[160px]">
                        <span class="text-[9px] font-bold text-blue-500">${i+1}</span>
                        <span class="truncate text-[10px] opacity-70">${s.title || 'Referansi'}</span>
                    </a>`;
                });
                sHtml += `</div><p class="text-[10px] text-blue-400 font-bold mt-2 italic">Dilangsir dari : Lunan Artificial Intelligence</p>`;
            }

            flow.innerHTML += `
                <div class="flex gap-4 px-4 py-8 ${!isAi ? 'flex-row-reverse' : 'animate-in fade-in slide-in-from-bottom-2 duration-500'}">
                    <div class="w-9 h-9 rounded-xl flex items-center justify-center font-bold text-xs shrink-0 shadow-lg ${isAi ? 'bg-[#10a37f] text-white' : 'bg-blue-600 text-white'}">
                        <i class="fa-solid ${isAi ? 'fa-robot' : 'fa-user'}"></i>
                    </div>
                    <div class="bubble ${!isAi ? 'bubble-user shadow-blue-500/10 shadow-xl' : 'bubble-ai'}">
                        <div class="text-[9px] opacity-30 mb-1 font-black tracking-widest uppercase">${role}</div>
                        <div class="text-sm md:text-base whitespace-pre-wrap">${text}</div>
                        ${sHtml}
                    </div>
                </div>`;
            scrollToBottom();
        }

        function syncHistory() {
            onValue(query(ref(db, `chats/${activeUser.uid}`), limitToLast(12)), s => {
                const list = document.getElementById('history-list');
                list.innerHTML = "";
                const snap = [];
                s.forEach(c => snap.push(c.val()));
                snap.reverse().forEach(d => {
                    list.innerHTML += `<div class="p-3 rounded-xl sidebar-item truncate flex items-center gap-3 transition">
                        <i class="fa-regular fa-comment opacity-30 text-[10px]"></i>
                        <span class="truncate">${d.q}</span>
                    </div>`;
                });
            });
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
